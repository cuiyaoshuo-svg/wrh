<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网页</title>
    <style>
        /* 页面整体样式 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }

        /* 顶部导航/标题栏 */
        header {
            background-color: #4A90E2;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }

        /* 内容主体容器 */
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* 卡片样式 */
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            background-color: #4A90E2;
            color: white;
            padding: 0.6rem 1.2rem;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #357ABD;
        }

        /* 页脚样式 */
        footer {
            text-align: center;
            padding: 1rem;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>欢迎来到我的主页</h1>
        <p>这是一个用 HTML 和 CSS 打造的简单网页</p>
    </header>

    <div class="container">
        
        <div class="card">
            <h2>关于我</h2>
            <p>你好！我正在学习网页制作。这个页面是一个基础的代码示例，用来展示页面布局和样式。</p>
        </div>

        <div class="card">
            <h2>我的兴趣</h2>
            <ul>
                <li>💻 编写代码与创造新东西</li>
                <li>📚 阅读与学习新知识</li>
                <li>🎮 游戏与休闲娱乐</li>
            </ul>
        </div>

        <div class="card">
            <h2>联系方式</h2>
            <p>如果你想了解更多，欢迎点击下方按钮联系我：</p>
            <a href="#" class="btn">发邮件给我</a>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 我的个人网站. 保留所有权利。</p>
    </footer>

</body>
</html>
