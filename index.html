
<!DOCTYPE html><!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的进阶个人主页</title>
    <style>
        /* 1. 全局变量定义（主题颜色） */
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #4A90E2;
            --nav-bg: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
        }

        /* 暗黑模式样式类 */
        body.dark-mode {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e0e0e0;
            --nav-bg: #0f3460;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }

        /* 2. 基础页面设置 */
        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 3. 导航栏 */
        nav {
            position: sticky;
            top: 0;
            background-color: var(--nav-bg);
            box-shadow: var(--shadow);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
        }

        /* 切换按钮 */
        .theme-toggle {
            cursor: pointer;
            border: none;
            background: var(--accent-color);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* 4. Hero 横幅区 */
        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background: linear-gradient(135deg, #4A90E2, #50E3C2);
            color: white;
        }

        /* 5. 主体容器与网格 */
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        /* 6. 表单样式 */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .btn-submit {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        /* 7. 页脚 */
        footer {
            text-align: center;
            padding: 2rem;
            opacity: 0.8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">MyWebsite</div>
        <div class="nav-links">
            <a href="#about">关于</a>
            <a href="#services">服务</a>
            <a href="#contact">联系</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 切换主题</button>
        </div>
    </nav>

    <header class="hero">
        <h1>探索现代网页设计</h1>
        <p>支持响应式布局与主题模式切换</p>
    </header>

    <div class="container">
        
        <section id="about">
            <h2>功能特色</h2>
            <div class="grid">
                <div class="card">
                    <h3>⚡ 快速加载</h3>
                    <p>优化过的轻量级 CSS 与原生 JS 交互。</p>
                </div>
                <div class="card">
                    <h3>📱 响应式适配</h3>
                    <p>自动适应手机、平板及桌面电脑屏幕。</p>
                </div>
                <div class="card">
                    <h3>🌙 深色模式</h3>
                    <p>点击导航栏按钮即可随时体验舒适暗色界面。</p>
                </div>
            </div>
        </section>

        <section id="contact" class="card">
            <h2>留言联系</h2>
            <form onsubmit="alert('消息已发送！'); return false;">
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" placeholder="请输入你的姓名" required>
                </div>
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="你的邮箱地址" required>
                </div>
                <div class="form-group">
                    <label for="message">内容</label>
                    <textarea id="message" rows="4" placeholder="写下你的留言..."></textarea>
                </div>
                <button type="submit" class="btn-submit">发送消息</button>
            </form>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 MyWebsite. Powered by HTML & CSS.</p>
    </footer>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>张小明 · 创意开发者</title>

    <!-- ===== 字体图标库 (Font Awesome) ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ============================================================
                   1.  CSS 变量（主题系统）
                   ============================================================ */
        :root {
            /* 主色 */
            --primary: #6C63FF;
            --primary-light: #8B83FF;
            --primary-dark: #4A42D9;

            /* 中性色 */
            --bg: #f0f2f8;
            --bg-card: #ffffff;
            --text: #1e1e2f;
            --text-secondary: #5a5a7a;
            --border: #e2e5ef;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(108, 99, 255, 0.15);

            /* 渐变 */
            --gradient-hero: linear-gradient(135deg, #6C63FF 0%, #3ECF8E 100%);

            /* 圆角 */
            --radius: 16px;
            --radius-sm: 10px;

            /* 过渡 */
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ---- 暗黑模式 ---- */
        body.dark-mode {
            --bg: #12121e;
            --bg-card: #1e1e32;
            --text: #ececf0;
            --text-secondary: #a8a8c8;
            --border: #2d2d4a;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 12px 40px rgba(108, 99, 255, 0.25);
            --gradient-hero: linear-gradient(135deg, #4A42D9 0%, #2A9D6E 100%);
        }

        /* ============================================================
                   2.  基础重置 & 全局
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
            padding-top: 72px;
            /* 为固定导航留空间 */;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ============================================================
                   3.  导航栏
                   ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background var(--transition), border-color var(--transition);
            box-shadow: var(--shadow);
        }

        .navbar .logo {
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar .logo i {
            -webkit-text-fill-color: initial;
            color: var(--primary);
            margin-right: 6px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: color var(--transition);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width var(--transition);
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 6px 14px 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
        }

        .theme-toggle:hover {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
        }

        .theme-toggle i {
            font-size: 1.1rem;
        }

        /* 移动端汉堡菜单 */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger span {
            display: block;
            width: 26px;
            height: 2.5px;
            background: var(--text);
            border-radius: 4px;
            transition: var(--transition);
        }

        /* ============================================================
                   4.  Hero 区域
                   ============================================================ */
        .hero {
            padding: 80px 0 60px;
            background: var(--gradient-hero);
            border-radius: 0 0 48px 48px;
            color: #fff;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            margin: 0 auto;
        }

        .hero-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            margin: 0 auto 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .hero h1 span {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 500px;
            margin: 0 auto 28px;
        }

        .hero-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .hero-badges span {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ============================================================
                   5.  通用卡片 & 网格
                   ============================================================ */
        .section {
            padding: 60px 0;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .section-subtitle {
            color: var(--text-secondary);
            margin-bottom: 36px;
            font-size: 1.05rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 26px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }

        .card-icon {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 14px;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* ============================================================
                   6.  技能条
                   ============================================================ */
        .skill-item {
            margin-bottom: 20px;
        }

        .skill-item .skill-label {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .skill-bar {
            height: 8px;
            background: var(--border);
            border-radius: 40px;
            overflow: hidden;
        }

        .skill-bar .fill {
            height: 100%;
            border-radius: 40px;
            background: var(--gradient-hero);
            width: 0%;
            transition: width 1s ease;
        }

        /* ============================================================
                   7.  项目展示
                   ============================================================ */
        .project-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }

        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .project-card .project-img {
            height: 180px;
            background: var(--gradient-hero);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .project-card .project-body {
            padding: 20px 24px 24px;
        }

        .project-card .project-body h4 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .project-card .project-body p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .project-tags span {
            background: var(--bg);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        /* ============================================================
                   8.  联系表单
                   ============================================================ */
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .contact-info h3 {
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .contact-info p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .contact-info .social-links {
            display: flex;
            gap: 16px;
        }

        .contact-info .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.2rem;
            transition: all var(--transition);
        }

        .contact-info .social-links a:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            transition: all var(--transition);
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient-hero);
            color: #fff;
            border: none;
            padding: 14px 32px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(108, 99, 255, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        /* ============================================================
                   9.  Toast 通知
                   ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 24px;
            box-shadow: var(--shadow-hover);
            display: flex;
            align-items: center;
            gap: 14px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            max-width: 420px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            font-size: 1.6rem;
            color: #3ECF8E;
        }

        .toast .toast-msg {
            font-weight: 500;
        }

        /* ============================================================
                   10. 页脚
                   ============================================================ */
        footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 20px;
        }

        footer .heart {
            color: #ff6b6b;
            display: inline-block;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        /* ============================================================
                   11. 滚动渐入动画
                   ============================================================ */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ============================================================
                   12. 响应式
                   ============================================================ */
        @media (max-width: 820px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                position: fixed;
                top: 72px;
                left: 0;
                right: 0;
                background: var(--bg-card);
                flex-direction: column;
                padding: 24px 20px 32px;
                gap: 18px;
                border-bottom: 1px solid var(--border);
                transform: translateY(-120%);
                transition: transform var(--transition);
                box-shadow: var(--shadow);
                backdrop-filter: blur(16px);
            }

            .nav-links.open {
                transform: translateY(0);
            }

            .hamburger {
                display: flex;
            }

            .theme-toggle {
                padding: 4px 12px 4px 8px;
                font-size: 0.8rem;
            }

            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }

            .hero-avatar {
                width: 90px;
                height: 90px;
                font-size: 2.6rem;
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 48px 0 40px;
                border-radius: 0 0 32px 32px;
            }

            .hero h1 {
                font-size: 1.8rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .section {
                padding: 40px 0;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    导航栏
    ============================================================ -->
    <n
